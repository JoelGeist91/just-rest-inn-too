<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d10">
<title>Just Rest Inn Too · Manyana</title>
<style>
:root{
  --ink:#171a20; --mute:#5c5e62; --faint:#8e9094; --line:#e6e6e6; --panel:#f4f4f4; --bg:#fff;
  --accent:#d8442f; --ok:#1f7a52; --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:0 18px calc(48px + env(safe-area-inset-bottom))}

/* hero */
.hero{color:#fff;background:
  linear-gradient(180deg,rgba(8,14,22,.62) 0%,rgba(8,14,22,.18) 34%,rgba(8,14,22,0) 55%,rgba(8,14,22,.5) 100%),
  #6f9ccf url(hero.jpg) center 62%/cover no-repeat;
  padding:calc(14px + env(safe-area-inset-top)) 18px 0;min-height:min(82vh,680px);display:flex}
.hero .in{max-width:680px;margin:0 auto;width:100%;display:flex;flex-direction:column;padding-bottom:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:36px}
.brand{font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;white-space:nowrap}
.who{background:rgba(20,24,28,.35);backdrop-filter:blur(8px);border:0;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.loc{margin:44px 0 6px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.85;text-align:center}
.hero h1{text-shadow:0 1px 18px rgba(0,0,0,.25);margin:0;font-size:clamp(30px,8.5vw,44px);font-weight:500;letter-spacing:-.01em;line-height:1.05;text-align:center}
.specs{display:flex;justify-content:center;gap:0;margin:auto 0 22px;padding-top:40px;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.specs div{flex:1;max-width:120px;min-width:0;text-align:center;border-left:1px solid rgba(255,255,255,.35)}
.specs div:first-child{border-left:0}
.specs b{display:block;font-size:28px;font-weight:500;line-height:1.1}
.specs span{font-size:10px;letter-spacing:.1em;white-space:nowrap;text-transform:uppercase;opacity:.9}
.actions{display:flex;gap:10px;margin:14px 0}
.hero .actions{margin:0;justify-content:center}
.wx{display:flex;gap:2px;overflow-x:auto;margin:18px -18px 0;padding:10px 18px;scrollbar-width:none;background:rgba(12,16,20,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.wx::-webkit-scrollbar{display:none}
.wx div{flex:1 0 56px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.wx span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;white-space:nowrap}
.wx b{font-size:15px;font-weight:500;line-height:1}
.wx em{font-style:normal;font-size:12px;opacity:.65;line-height:1}
.wx small{font-size:10px;color:#9fd0ff;line-height:1}
@media(min-width:720px){.wx{margin:18px 0 0;border-radius:14px}}
.credit{margin:0;font-size:11px;color:var(--faint)}.credit a{color:inherit}
.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:500;font-size:14px;letter-spacing:.02em;background:var(--ink);color:#fff;flex:1;min-height:46px;transition:opacity .15s}
.btn:active{opacity:.75}
.hero .btn{background:#fff;color:var(--ink);max-width:260px}
.hero .btn.alt{background:rgba(20,24,28,.45);color:#fff;border:0;backdrop-filter:blur(8px)}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn.danger{background:#fff;color:#b3261e;box-shadow:inset 0 0 0 1px #e9c4c0}
.btn:disabled{opacity:.45}
.demo{background:var(--panel);border-radius:var(--r);padding:10px 14px;margin:16px 0 0;font-size:13px;color:var(--mute)}

h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--faint);margin:34px 0 12px}

/* tonight cards */
.stays{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(142px,1fr);gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.stays::-webkit-scrollbar{display:none}
.stay{background:var(--panel);border:0;border-radius:var(--r);padding:14px;text-align:left;min-height:118px;display:flex;flex-direction:column}
.stay b{font-size:16px;font-weight:500}
.stay small{color:var(--mute);font-size:12px;margin-top:2px}
.stay em{font-style:normal;margin-top:auto;font-size:12px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.stay em i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.stay.taken em i{background:var(--accent)}

/* month roster */
.month{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.month strong{font-size:20px;font-weight:500;letter-spacing:-.01em}
.month button{background:var(--panel);border:0;border-radius:999px;width:40px;height:40px;font-size:18px}
.month .today{width:auto;padding:0 14px;font-size:13px;font-weight:500}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
th{background:#fff;color:var(--faint);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:10px 2px;z-index:2;border-bottom:1px solid var(--ink)}
th:first-child{text-align:left}
th:first-child,td:first-child{width:58px;position:sticky;left:0;background:#fff;z-index:1}
.grid{overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:thin}
.grid table{min-width:620px}
tr.grp th{border-bottom:0;padding:4px 2px 0;color:var(--ink);font-size:11px}
.sep{border-left:1px solid var(--line)}
td.sep{padding-left:4px}
.ghead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:13px;font-weight:500}
.ghead button{border:0;background:var(--panel);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:500}
td{height:40px;border-bottom:1px solid var(--line);padding:2px;font-size:12px;overflow:hidden}
td:first-child{padding:0 4px 0 0;color:var(--faint);white-space:nowrap;font-size:12px}
td:first-child b{color:var(--ink);font-weight:500;font-size:15px;margin-right:3px}
tr.we td:first-child b{font-weight:700}
tr.past td{color:#c4c4c4}
tr.past td:first-child b{color:#c4c4c4}
tr.past td button{opacity:.4}
tr.now td{border-bottom-color:var(--ink)}
tr.now td:first-child,tr.now td:first-child b{color:var(--accent)}
td button{display:block;width:100%;height:35px;border:0;border-radius:8px;background:transparent;padding:0 7px;text-align:left;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.free button{color:#d0d0d0;text-align:center;font-weight:400;font-size:15px}
td.free button:active{background:var(--panel);color:var(--ink)}
td.cont button{font-weight:400;color:transparent!important}
td.block button{background:repeating-linear-gradient(135deg,#e4e4e4 0 5px,#f1f1f1 5px 10px)!important;color:#6a6a6a!important}
td.block.cont button{color:transparent!important}

/* upcoming */
.card{background:#fff;border:0;border-bottom:1px solid var(--line);padding:16px 0;display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.card strong{display:block;font-weight:500;font-size:16px}
.card span{display:block;color:var(--mute);font-size:13px}
.card em{font-style:normal;display:block;font-size:13px;margin-top:4px;color:var(--ink)}
.empty{color:var(--faint);font-size:13px;padding:10px 0}
footer{margin-top:34px;text-align:center}
footer button{background:none;border:0;color:var(--faint);font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:12px}

/* sheets */
dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:22px 22px 0 0;background:#fff;color:var(--ink);max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media(min-width:600px){dialog{margin:auto;border-radius:22px}}
dialog::backdrop{background:rgba(10,12,14,.55);backdrop-filter:blur(3px)}
.sheet{padding:24px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 14px;font-size:24px;font-weight:500;letter-spacing:-.01em}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
input[type=text],input[type=email],input[type=date],input[type=number],input[type=password],textarea{width:100%;border:0;border-radius:10px;padding:12px 14px;background:var(--panel);min-height:48px;outline:none}
input:focus,textarea:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
textarea{min-height:68px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{position:relative;letter-spacing:0;text-transform:none}
.unit input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.unit div{border-radius:12px;padding:12px 14px;background:var(--panel);min-height:66px;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .12s}
.unit b{display:block;font-size:15px;font-weight:500;color:var(--ink)}.unit small{color:var(--mute);font-size:12px;font-weight:400}
.unit input:checked+div{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.unit input:disabled+div{opacity:.55}
.unit input:disabled+div small{color:var(--accent)}
.unit input:focus-visible+div{outline:2px solid var(--ink);outline-offset:2px}
.err{color:#b3261e;font-size:13px;min-height:20px;margin:12px 0 0}
.sheet .actions{margin:16px 0 0}
.kv{margin:0 0 6px}.kv dt{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.14em;margin-top:14px}.kv dd{margin:3px 0 0;font-size:16px}
.gate{max-width:360px;margin:16vh auto 0;padding:0 22px;text-align:center}
.gate h1{font-weight:500;font-size:30px;letter-spacing:-.01em;margin:0 0 6px}.gate p{color:var(--faint);margin:0 0 22px;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.gate .err{letter-spacing:0;text-transform:none;font-size:13px;color:#b3261e}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="sheet"></dialog>
<div id="toast" role="status"></div>

<script type="module">
/* ============================================================
   SETUP: paste your Firebase web config between the braces.
   While this is null the app runs in DEMO mode (data stays on
   this device only, owner PIN is 1234).
   ============================================================ */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyADV7B8A1z3GX22M-4X60P-NoCv_9D8fG8",
    authDomain: "just-rest-inn-too.firebaseapp.com",
    projectId: "just-rest-inn-too",
    storageBucket: "just-rest-inn-too.firebasestorage.app",
    messagingSenderId: "572857792777",
    appId: "1:572857792777:web:dce0db68b34bb2d52e3bd8"
  },

  // Optional: confirmation emails with a private change/cancel link (see SETUP.md step 6).
  emailjs: null
  /* emailjs: { serviceId:"...", templateId:"...", publicKey:"..." } */
};

const HOUSE = 'Just Rest Inn Too', PLACE = 'Manyana';
const UNITS = [
  {id:'bed1', group:'House', name:'Bedroom 1',    short:'Bed 1',   beds:'Queen'},
  {id:'bed2', group:'House', name:'Bedroom 2',    short:'Bed 2',   beds:'Queen'},
  {id:'bed3', group:'House', name:'Bedroom 3',    short:'Bed 3',   beds:'Queen'},
  {id:'shq1', group:'Shed',  name:'Shed Queen 1', short:'Queen 1', beds:'Queen bed in the shed'},
  {id:'shq2', group:'Shed',  name:'Shed Queen 2', short:'Queen 2', beds:'Queen bed in the shed'},
  {id:'shb1', group:'Shed',  name:'Shed Bunk 1',  short:'Bunk 1',  beds:'Double bunk in the shed'},
  {id:'shb2', group:'Shed',  name:'Shed Bunk 2',  short:'Bunk 2',  beds:'Double bunk in the shed'}
];
const SHED = UNITS.filter(u=>u.group==='Shed').map(u=>u.id);
// Bookings made before the shed was split used a single 'shed' unit: treat them as all four beds.
const normalise = b => ({...b, units:[...new Set((b.units||[]).flatMap(u=>u==='shed'?SHED:[u]))]});
function unitsLabel(b){
  if(UNITS.every(u=>b.units.includes(u.id))) return 'Whole property';
  const house=b.units.filter(u=>!SHED.includes(u)).map(unitName);
  const shed=SHED.every(u=>b.units.includes(u))?['The whole shed']:b.units.filter(u=>SHED.includes(u)).map(unitName);
  return [...house,...shed].join(', ');
}
const MAX_NIGHTS = 90;

/* ---------- dates (plain YYYY-MM-DD strings, no timezone maths) ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = toDate(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const fmt = s => toDate(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
function nights(ci,co){ const out=[]; for(let d=ci; d<co && out.length<=MAX_NIGHTS+1; d=addDays(d,1)) out.push(d); return out; }
const nightKeys = b => b.units.flatMap(u => nights(b.checkIn,b.checkOut).map(d => `${u}_${d}`));

/* ---------- storage ---------- */
function localStore(){
  const KEY='jri_demo'; let cb=()=>{};
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||[] }catch{ return [] } };
  const write=l=>{ try{ localStorage.setItem(KEY,JSON.stringify(l)) }catch{} cb(l); };
  let mem=read();
  return {
    demo:true,
    async init(){ return true },
    subscribe(f){ cb=f; f(mem) },
    async save(b,prev){
      const id=prev?prev.id:'b'+Date.now()+Math.random().toString(36).slice(2,6);
      mem=mem.filter(x=>x.id!==id).concat({...b,id}); write(mem); return id;
    },
    async remove(b){ mem=mem.filter(x=>x.id!==b.id); write(mem) },
    async checkOwner(pin){ return pin==='1234' }
  };
}
async function fireStore(cfg){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const {initializeApp}=await import(base+'firebase-app.js');
  const fs=await import(base+'firebase-firestore.js');
  const db=fs.getFirestore(initializeApp(cfg));
  let code; const col=n=>fs.collection(db,'houses',code,n);
  return {
    async init(c){ if(!c||/[\/\s]/.test(c)) return false;
      const s=await fs.getDoc(fs.doc(db,'houses',c)); if(!s.exists()) return false; code=c; return true },
    subscribe(f,onErr){ fs.onSnapshot(col('bookings'), s=>f(s.docs.map(d=>({id:d.id,...d.data()}))), onErr) },
    async save(b,prev){
      const batch=fs.writeBatch(db);
      const ref=prev?fs.doc(col('bookings'),prev.id):fs.doc(col('bookings'));
      const oldK=new Set(prev?nightKeys(prev):[]), newK=new Set(nightKeys(b));
      for(const k of oldK) if(!newK.has(k)) batch.delete(fs.doc(col('nights'),k));
      // The rules refuse to overwrite an existing night, so a clash fails the whole batch.
      for(const k of newK) if(!oldK.has(k)) batch.set(fs.doc(col('nights'),k),{bookingId:ref.id});
      batch.set(ref,b);
      await batch.commit();
      return ref.id;
    },
    async remove(b){
      const batch=fs.writeBatch(db);
      for(const k of nightKeys(b)) batch.delete(fs.doc(col('nights'),k));
      batch.delete(fs.doc(col('bookings'),b.id));
      await batch.commit();
    },
    async checkOwner(pin){ if(!pin||/[\/\s]/.test(pin)) return false;
      return (await fs.getDoc(fs.doc(db,'houses',code,'owner',pin))).exists() }
  };
}

/* ---------- state ---------- */
const ls = { get:k=>{ try{ return localStorage.getItem(k) }catch{ return null } },
             set:(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch{} } };
let store, bookings=[], me=ls.get('jri_name')||'', owner=false;
let view = (()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()} })();
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const same = (a,b) => (a||'').trim().toLowerCase()===(b||'').trim().toLowerCase();
const mine = b => !!me && (same(b.name,me) || same(b.createdBy,me));
/* Each booking has a private key. This phone keeps the keys for bookings made on it;
   the confirmation email carries the key in its link. The database only holds a hash. */
let houseCode='';
const tokens = (()=>{ try{ return JSON.parse(ls.get('jri_tokens'))||{} }catch{ return {} } })();
const keepToken = (id,t) => { tokens[id]=t; ls.set('jri_tokens',JSON.stringify(tokens)) };
const newToken = () => { const a=new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join('') };
async function hashToken(t, algo = globalThis.crypto?.subtle ? 's' : 'f'){
  if(algo==='s'){ const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
    return 's:'+[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let x=2166136261,y=5381; for(const c of t){ x=Math.imul(x^c.charCodeAt(0),16777619)>>>0; y=(Math.imul(y,33)^c.charCodeAt(0))>>>0 }
  return 'f:'+x.toString(16)+y.toString(16);   // fallback for pages not served over https
}
async function tokenFits(b,t){ if(!b?.tokenHash||!t) return false;
  const algo=b.tokenHash[0]; if(algo==='s' && !globalThis.crypto?.subtle) return false;
  return await hashToken(t,algo)===b.tokenHash; }
const hasKey = b => !!tokens[b.id];
const canEdit = b => owner || (!b.isBlock && (hasKey(b) || (!b.tokenHash && mine(b))));
const manageLink = (id,t) => `${location.href.split('#')[0]}#k=${encodeURIComponent(houseCode)}&m=${id}.${t}`;
async function sendEmail(to,b,link){
  const e=CONFIG.emailjs, n=nights(b.checkIn,b.checkOut).length;
  const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({service_id:e.serviceId,template_id:e.templateId,user_id:e.publicKey,template_params:{
      to_email:to, to_name:b.name, house:HOUSE, place:PLACE,
      dates:`${fmt(b.checkIn)} to ${fmt(b.checkOut)} (${n} night${n==1?'':'s'})`,
      rooms:unitsLabel(b), guests:String(b.guests), notes:b.notes||'None', manage_link:link }})});
  if(!r.ok) throw new Error('email '+r.status+' '+await r.text());
}
const HUES=[200,18,150,280,42,330,95,235,0,172];
function hue(name){ let h=0; for(const c of (name||'').trim().toLowerCase()) h=(h*31+c.charCodeAt(0))>>>0; return HUES[h%HUES.length] }
const bg = n => `hsl(${hue(n)} 42% 90%)`, fg = n => `hsl(${hue(n)} 45% 22%)`, solid = n => `hsl(${hue(n)} 45% 46%)`;
const unitName = id => UNITS.find(u=>u.id===id)?.name || id;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),3200) }

function occupancy(){ const m=new Map(); for(const b of bookings) for(const k of nightKeys(b)) m.set(k,b); return m }
function clash(unit,ci,co,exceptId){
  for(const b of bookings){ if(b.id===exceptId || !b.units.includes(unit)) continue;
    if(b.checkIn<co && ci<b.checkOut) return b; }
  return null;
}

/* ---------- weather (Open-Meteo, Manyana NSW) ---------- */
const WX_URL='https://api.open-meteo.com/v1/forecast?latitude=-35.26&longitude=150.51&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Australia%2FSydney&forecast_days=10';
let wx=null;
async function loadWeather(){
  try{ const c=JSON.parse(sessionStorage.getItem('jri_wx')||'null'); if(c&&Date.now()-c.t<36e5&&c.d?.length){ wx=c.d; return; } }catch{}
  try{ const r=await fetch(WX_URL); if(!r.ok) return; const d=(await r.json()).daily, codes=d.weather_code||d.weathercode;
    wx=d.time.map((t,i)=>({date:t, code:codes[i], hi:Math.round(d.temperature_2m_max[i]), lo:Math.round(d.temperature_2m_min[i]), rain:d.precipitation_probability_max?.[i]??0}));
    try{ sessionStorage.setItem('jri_wx',JSON.stringify({t:Date.now(),d:wx})) }catch{} }
  catch(e){ console.error(e) }
}
function wxIcon(c){
  const sun='<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>';
  const cloud='<path d="M7 18h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7 9.5 4.25 4.25 0 0 0 7 18z"/>';
  const hi='<path d="M8 15h9a3.2 3.2 0 0 0 .4-6.38A4.4 4.4 0 0 0 9 8.2 3.4 3.4 0 0 0 8 15z"/>';
  const k = c===0?sun : c<=2?'<circle cx="7.5" cy="8" r="2.6"/><path d="M7.5 2.8v1.2M2.3 8h1.2M3.8 4.3l.9.9M11.2 4.3l-.9.9"/><path d="M9 20h8.5a3.5 3.5 0 0 0 .4-6.98A4.8 4.8 0 0 0 9 12.5 3.75 3.75 0 0 0 9 20z"/>'
    : c===3||(c>=71&&c<=77)?cloud : c===45||c===48?hi+'<path d="M5 18.5h14M7 21.5h10"/>'
    : c>=95?hi+'<path d="M12.5 16l-2 3h3l-2 3"/>' : hi+'<path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/>';
  return `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${k}</svg>`;
}

/* ---------- main render ---------- */
function render(){
  const occ=occupancy(), t=today();
  const first=new Date(view.y,view.m,1), days=new Date(view.y,view.m+1,0).getDate();
  const title=first.toLocaleDateString('en-AU',{month:'long',year:'numeric'});
  let rows='';
  for(let i=1;i<=days;i++){
    const d=`${view.y}-${pad(view.m+1)}-${pad(i)}`, dt=toDate(d), dow=dt.getDay();
    const cls=[(dow===0||dow===6||dow===5)?'we':'', d<t?'past':'', d===t?'now':''].join(' ');
    let tds=`<td><b>${i}</b> ${dt.toLocaleDateString('en-AU',{weekday:'short'})}</td>`;
    for(const u of UNITS){
      const b=occ.get(`${u.id}_${d}`);
      const sep=u.id===SHED[0]?' sep':'';
      if(!b){ tds+=`<td class="free${sep}"><button data-act="new" data-d="${d}" data-u="${u.id}" aria-label="Book ${u.name} from ${fmt(d)}">+</button></td>`; continue; }
      const cont = b.checkIn!==d && i!==1;
      const label = b.isBlock ? 'Blocked' : b.name;
      tds+=`<td class="${b.isBlock?'block':''} ${cont?'cont':''}${sep}"><button data-act="detail" data-id="${esc(b.id)}" style="background:${bg(b.name)};color:${fg(b.name)}" aria-label="${esc(label)}, ${u.name}, ${fmt(d)}">${esc(label)}</button></td>`;
    }
    rows+=`<tr class="${cls}">${tds}</tr>`;
  }
  const up=bookings.filter(b=>b.checkOut>t).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));
  const cards=up.map(b=>{
    const n=nights(b.checkIn,b.checkOut).length;
    const head=b.isBlock?'Blocked out':`${esc(b.name)}${b.guests?` · ${b.guests} ${b.guests==1?'person':'people'}`:''}`;
    return `<button class="card" data-act="detail" data-id="${esc(b.id)}">
      <i class="dot" style="background:${b.isBlock?'#aaa':solid(b.name)}"></i>
      <div><strong>${head}</strong>
      <span>${fmt(b.checkIn)} → ${fmt(b.checkOut)} · ${n} night${n==1?'':'s'}</span>
      <span>${esc(unitsLabel(b))}</span>
      ${b.notes?`<em>“${esc(b.notes)}”</em>`:''}</div></button>`;
  }).join('') || `<div class="empty">Nobody's booked yet. The place is all yours.</div>`;

  const stays=UNITS.map(u=>{
    const b=occ.get(`${u.id}_${t}`);
    const next=bookings.filter(x=>x.units.includes(u.id)&&x.checkIn>t).sort((a,c)=>a.checkIn.localeCompare(c.checkIn))[0];
    const status=b?`${b.isBlock?'Blocked':esc(b.name)} until ${fmt(b.checkOut)}`:next?`Free until ${fmt(next.checkIn)}`:'Free';
    return `<button class="stay ${b?'taken':''}" ${b?`data-act="detail" data-id="${esc(b.id)}"`:`data-act="new" data-u="${u.id}"`}>
      <b>${u.name}</b><small>${esc(u.beds)}</small><em><i></i>${status}</em></button>`;
  }).join('');
  $('#app').innerHTML=`
  <header class="hero"><div class="in">
    <div class="top"><span class="brand">${esc(PLACE)}</span>
      <button class="who" data-act="name">${me?esc(me):'Who are you?'}${owner?' · owner':''}</button></div>
    <p class="loc">Welcome to</p><h1>${esc(HOUSE)}</h1>
    <div class="specs"><div><b>3</b><span>Bedrooms</span></div><div><b>1</b><span>Shed</span></div><div><b>5</b><span>Queen beds</span></div><div><b>2</b><span>Double bunks</span></div></div>
    <div class="actions"><button class="btn" data-act="new">Book a stay</button>
      ${owner?`<button class="btn alt" data-act="block">Block out dates</button>`:''}</div>
    ${wx?`<div class="wx" aria-label="10 day forecast for Manyana">${wx.map((d,i)=>`<div><span>${i===0?'Today':toDate(d.date).toLocaleDateString('en-AU',{weekday:'short'})+' '+toDate(d.date).getDate()}</span>${wxIcon(d.code)}<b>${d.hi}°</b><em>${d.lo}°</em><small>${d.rain>=30?d.rain+'%':'&nbsp;'}</small></div>`).join('')}</div>`:''}
  </div></header>
  <div class="wrap">
    ${store.demo?`<div class="demo"><b>Demo mode.</b> Bookings are saved on this device only until the database is connected.</div>`:''}
    <h2>Tonight</h2><div class="stays">${stays}</div>
    <h2>Calendar</h2>
    <div class="month"><button data-act="prev" aria-label="Previous month">‹</button>
      <strong>${title}</strong>
      <span><button class="today" data-act="today">Today</button> <button data-act="next" aria-label="Next month">›</button></span></div>
    <div class="grid"><table><thead>
      <tr class="grp"><th></th><th colspan="${UNITS.length-SHED.length}">House</th><th colspan="${SHED.length}" class="sep">Shed</th></tr>
      <tr><th>Night</th>${UNITS.map(u=>`<th class="${u.id===SHED[0]?'sep':''}">${u.short}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="empty">Each row is a night. Swipe sideways for the shed beds. Tap + to book from that date, or a name for details. Check-out day is free for the next arrival.</div>
    <h2>Who's going down</h2>${cards}
    <footer><button data-act="owner">${owner?'Leave owner mode':'Owner'}</button>
      <p class="credit">Forecast by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p></footer>
  </div>`;
}

/* ---------- sheets ---------- */
const sheet=$('#sheet');
function open(html){ sheet.innerHTML=`<div class="sheet">${html}</div>`; if(!sheet.open) sheet.showModal(); }
function close(){ if(sheet.open) sheet.close() }
sheet.addEventListener('click',e=>{ if(e.target===sheet) close() });

function openName(){
  const names=[...new Set(bookings.filter(b=>!b.isBlock).map(b=>b.name))].sort();
  open(`<h3>Who are you?</h3>
    <form data-form="name"><label for="nm">Your name, the way the family knows you</label>
    <input id="nm" name="name" type="text" list="names" value="${esc(me)}" autocomplete="given-name" maxlength="30" required>
    <datalist id="names">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <div class="actions"><button class="btn">Save</button></div></form>`);
}
function openOwner(){
  if(owner){ owner=false; ls.set('jri_pin',null); render(); return; }
  open(`<h3>Owner mode</h3><form data-form="owner"><label for="pin">Owner PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" required>
    <p class="err" id="err"></p><div class="actions"><button class="btn">Unlock</button></div></form>`);
}
function openDetail(id){
  const b=bookings.find(x=>x.id===id); if(!b) return;
  const n=nights(b.checkIn,b.checkOut).length;
  open(`<h3>${b.isBlock?'Blocked out':esc(b.name)}</h3><dl class="kv">
    <dt>Dates</dt><dd>${fmt(b.checkIn)} → ${fmt(b.checkOut)} (${n} night${n==1?'':'s'})</dd>
    <dt>Where</dt><dd>${esc(unitsLabel(b))}</dd>
    ${b.guests?`<dt>People</dt><dd>${b.guests}</dd>`:''}
    ${b.notes?`<dt>Notes</dt><dd>${esc(b.notes)}</dd>`:''}</dl>
    <div class="actions">${canEdit(b)?`<button class="btn alt" data-act="edit" data-id="${esc(b.id)}">Change</button>
      <button class="btn danger" data-act="cancel" data-id="${esc(b.id)}">Cancel booking</button>`
      :`<button class="btn alt" data-act="close">Close</button>`}</div>
    ${canEdit(b)?'':`<p class="empty">${b.isBlock?'Only the owner can change this.':'To change this booking, open the link in its confirmation email, use the phone it was booked on, or ask the owner.'}</p>`}`);
}
let editing=null, blocking=false;
function openBooking({date,unit,booking,block}={}){
  if(!me && !block && !booking){ openName(); return; }
  editing=booking||null; blocking=!!(block||booking?.isBlock);
  const ci=booking?.checkIn || date || today(), co=booking?.checkOut || addDays(ci,2);
  const picked=new Set(booking?.units || (blocking?UNITS.map(u=>u.id):unit?[unit]:[]));
  open(`<h3>${booking?'Change booking':blocking?'Block out dates':'Book a stay'}</h3>
  <form data-form="booking">
    ${blocking?'':`<label for="bn">Booked for</label><input id="bn" name="name" type="text" maxlength="30" required value="${esc(booking?.name||me)}">`}
    <div class="row"><div><label for="ci">Arrive</label><input id="ci" name="checkIn" type="date" required value="${ci}"></div>
      <div><label for="co">Leave</label><input id="co" name="checkOut" type="date" required value="${co}"></div></div>
    <label>${blocking?'What to block':'Where are you sleeping?'}</label>
    ${['House','Shed'].map(g=>`<div class="ghead"><span>${g}</span>${g==='Shed'?`<button type="button" data-act="allshed">Whole shed</button>`:''}</div>
    <div class="units">${UNITS.filter(u=>u.group===g).map(u=>`<label class="unit" style="margin:0"><input type="checkbox" name="units" value="${u.id}" ${picked.has(u.id)?'checked':''}>
      <div><b>${g==='Shed'?u.short:u.name}</b><small data-beds="${esc(u.beds.replace(' in the shed',''))}">${esc(u.beds.replace(' in the shed',''))}</small></div></label>`).join('')}</div>`).join('')}
    ${blocking?'':`<label for="gs">How many people?</label><input id="gs" name="guests" type="number" inputmode="numeric" min="1" max="30" required value="${booking?.guests||2}">`}
    <label for="nt">${blocking?'Reason (optional)':'Notes (optional)'}</label>
    <textarea id="nt" name="notes" maxlength="200" placeholder="${blocking?'e.g. painting the deck':'e.g. bringing the dog, arriving late Friday'}">${esc(booking?.notes||'')}</textarea>
    ${blocking||(booking&&!hasKey(booking))?'':`<label for="em">Email for your confirmation (optional)</label>
    <input id="em" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" maxlength="120" value="${esc(ls.get('jri_email')||'')}" placeholder="you@example.com">
    <p class="empty" style="padding:6px 0 0">We'll email a private link to change or cancel. Without it, only this phone (or the owner) can change the booking.</p>`}
    <p class="err" id="err"></p>
    <div class="actions"><button type="button" class="btn alt" data-act="close">Back</button><button class="btn" id="go">${booking?'Save changes':blocking?'Block out':'Confirm booking'}</button></div>
  </form>`);
  refreshUnits();
}
function refreshUnits(){
  const f=sheet.querySelector('[data-form=booking]'); if(!f) return;
  const ci=f.checkIn.value, co=f.checkOut.value, ok=ci&&co&&co>ci;
  f.querySelectorAll('input[name=units]').forEach(box=>{
    const small=box.nextElementSibling.querySelector('small');
    const c=ok?clash(box.value,ci,co,editing?.id):null;
    box.disabled=!!c; if(c) box.checked=false;
    small.textContent=c?`Taken: ${c.isBlock?'blocked out':c.name}`:small.dataset.beds;
  });
}
sheet.addEventListener('change',e=>{
  if(e.target.name==='checkIn'){ const f=e.target.form; if(f.checkOut.value<=f.checkIn.value) f.checkOut.value=addDays(f.checkIn.value,1); }
  if(e.target.name==='checkIn'||e.target.name==='checkOut') refreshUnits();
});

async function submitBooking(f){
  const err=sheet.querySelector('#err'), d=new FormData(f);
  const ci=d.get('checkIn'), co=d.get('checkOut'), units=d.getAll('units');
  const fail=m=>{ err.textContent=m; return };
  if(!ci||!co||co<=ci) return fail('Leave date needs to be after the arrive date.');
  if(nights(ci,co).length>MAX_NIGHTS) return fail(`That's longer than ${MAX_NIGHTS} nights. Split it into two bookings.`);
  if(!units.length) return fail('Pick at least one bedroom or shed bed.');
  for(const u of units){ const c=clash(u,ci,co,editing?.id); if(c) return fail(`${unitName(u)} is already taken by ${c.isBlock?'a block-out':c.name} on those dates.`); }
  const b={ name: blocking ? (editing?.name||me||'Owner') : d.get('name').trim(), units, checkIn:ci, checkOut:co,
    guests: blocking?0:Math.max(1,parseInt(d.get('guests'),10)||1), notes:(d.get('notes')||'').trim(),
    isBlock:blocking, createdBy: editing?.createdBy || me || 'Owner', updatedAt:Date.now() };
  if(!b.name) return fail('Add a name.');
  const go=sheet.querySelector('#go'); go.disabled=true;
  const email=(d.get('email')||'').trim(); let token=null;
  if(!blocking){ token = editing ? tokens[editing.id] : newToken();
    if(editing?.tokenHash) b.tokenHash=editing.tokenHash;
    else { token = token || newToken(); b.tokenHash=await hashToken(token); } }
  try{ const id=await store.save(b,editing);
    if(token) keepToken(id,token);
    let msg=editing?'Booking updated':blocking?'Dates blocked':'Booked. See you down there!';
    if(email && token){ ls.set('jri_email',email);
      if(!CONFIG.emailjs) msg+=' (No email sent: email is not set up yet.)';
      else try{ await sendEmail(email,b,manageLink(id,token)); msg+=' Confirmation emailed.' }
           catch(e2){ console.error(e2); msg='Saved, but the email did not send. This phone can still change it.' } }
    close(); toast(msg);
    view={y:toDate(ci).getFullYear(), m:toDate(ci).getMonth()}; render(); }
  catch(e){ console.error(e); go.disabled=false;
    fail(/permission|denied/i.test(e?.code||e?.message||'') ? 'Someone just grabbed one of those rooms. Close this and check the calendar.' : 'Could not save. Check your connection and try again.'); }
}

/* ---------- events ---------- */
document.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target, kind=f.dataset.form;
  if(kind==='name'){ me=f.name.value.trim(); ls.set('jri_name',me); close(); render(); }
  if(kind==='booking') submitBooking(f);
  if(kind==='gate'){ const c=f.code.value.trim(); f.querySelector('button').disabled=true; if(!await enter(c)){ f.querySelector('button').disabled=false; $('#gerr').textContent="That passcode didn't work."; } }
  if(kind==='owner'){ const pin=f.pin.value.trim(); let ok=false; try{ ok=await store.checkOwner(pin) }catch{}
    if(ok){ owner=true; ls.set('jri_pin',pin); close(); render(); toast('Owner mode on'); } else sheet.querySelector('#err').textContent='Wrong PIN.'; }
});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, id=el.dataset.id;
  if(a==='prev'||a==='next'){ const d=new Date(view.y,view.m+(a==='next'?1:-1),1); view={y:d.getFullYear(),m:d.getMonth()}; render(); }
  if(a==='today'){ const d=new Date(); view={y:d.getFullYear(),m:d.getMonth()}; render(); }
  if(a==='new') openBooking({date:el.dataset.d&&el.dataset.d>=today()?el.dataset.d:undefined, unit:el.dataset.u});
  if(a==='block') openBooking({block:true});
  if(a==='detail') openDetail(id);
  if(a==='edit') openBooking({booking:bookings.find(b=>b.id===id)});
  if(a==='name') openName();
  if(a==='owner') openOwner();
  if(a==='close') close();
  if(a==='allshed'){ const boxes=[...sheet.querySelectorAll('input[name=units]')].filter(x=>SHED.includes(x.value)&&!x.disabled);
    const all=boxes.every(x=>x.checked); boxes.forEach(x=>x.checked=!all); }
  if(a==='cancel'){ const b=bookings.find(x=>x.id===id); if(!b) return;
    if(el.dataset.sure){ el.disabled=true; try{ await store.remove(b); close(); toast('Booking cancelled'); }catch(err){ console.error(err); el.disabled=false; toast('Could not cancel. Try again.'); } }
    else { el.dataset.sure='1'; el.textContent='Tap again to confirm'; } }
});

/* ---------- boot ---------- */
function gate(msg){
  $('#app').innerHTML=`<div class="gate"><h1>${esc(HOUSE)}</h1><p>${esc(PLACE)}</p>
    <form data-form="gate"><input name="code" type="text" placeholder="Family passcode" autocapitalize="none" autocomplete="off" required>
    <p class="err" id="gerr">${esc(msg||'')}</p><div class="actions"><button class="btn">Come in</button></div></form></div>`;
}
async function enter(code){
  let ok=false; try{ ok=await store.init(code) }catch(e){ console.error(e) }
  if(!ok) return false;
  ls.set('jri_code',code); houseCode=code;
  const pin=ls.get('jri_pin'); if(pin){ try{ owner=await store.checkOwner(pin) }catch{} }
  let pending=new URLSearchParams(location.hash.slice(1)).get('m');
  store.subscribe(async list=>{ bookings=list.map(normalise); render(); if(sheet.open) refreshUnits();
      if(pending){ const [id,t]=pending.split('.'); pending=null; const b=bookings.find(x=>x.id===id);
        history.replaceState(null,'',location.pathname+location.search+'#k='+encodeURIComponent(code));
        if(!b) toast('That booking no longer exists.');
        else if(await tokenFits(b,t)){ keepToken(id,t); render(); const d0=toDate(b.checkIn); view={y:d0.getFullYear(),m:d0.getMonth()}; render(); openDetail(id); }
        else toast('That link is not valid for this booking.'); } },
                  err=>{ console.error(err); toast('Lost connection to the bookings.'); });
  loadWeather().then(()=>{ if(wx) render() });
  if(!me && !pending) openName();
  return true;
}
(async()=>{
  try{ store = CONFIG.firebase ? await fireStore(CONFIG.firebase) : localStore(); }
  catch(e){ console.error(e); $('#app').innerHTML='<div class="gate"><p>Could not reach the booking database. Check your connection and reload.</p></div>'; return; }
  if(store.demo){ await enter('demo'); return; }
  const fromLink=new URLSearchParams(location.hash.slice(1)).get('k');
  const code=fromLink||ls.get('jri_code');
  if(!code || !await enter(code)) gate(code?"That link's passcode didn't work.":'');
})();
</script>
