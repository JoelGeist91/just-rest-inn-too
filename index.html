<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f3d4c">
<title>Just Rest Inn Too · Manyana</title>
<style>
:root{
  --sea:#0f3d4c; --sea2:#1c6278; --sand:#f6f1e7; --card:#fffdf8; --line:#e4dccb;
  --ink:#1d2a2e; --mute:#6b7a7e; --coral:#e2603f; --ok:#2f7d5b;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--sand);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom))}
header{background:var(--sea);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 20px}
header .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
header h1{font-size:22px;margin:0;letter-spacing:.2px}
header p{margin:2px 0 0;opacity:.75;font-size:13px;text-transform:uppercase;letter-spacing:1.5px}
.who{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap;max-width:45vw;overflow:hidden;text-overflow:ellipsis}
.demo{background:#fff3c9;border:1px solid #ecd98a;border-radius:10px;padding:8px 12px;margin:12px 0 0;font-size:13px}
.actions{display:flex;gap:8px;margin:14px 0}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--coral);color:#fff;flex:1}
.btn.alt{background:var(--card);color:var(--sea);border:1px solid var(--line)}
.btn.danger{background:#fff;color:#b3261e;border:1px solid #e7b9b5}
.btn:disabled{opacity:.5}
.btn.small{flex:0;padding:9px 12px;font-size:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mute);margin:22px 0 8px}
.month{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.month strong{font-size:18px}
.month button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:44px;height:40px;font-size:18px}
.month .today{width:auto;padding:0 12px;font-size:14px}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th{position:sticky;top:0;background:var(--sea);color:#fff;font-size:12px;font-weight:600;padding:8px 2px;z-index:2}
th small{display:block;font-weight:400;opacity:.7;font-size:10px}
th:first-child,td:first-child{width:62px}
td{height:38px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:0;font-size:12px;overflow:hidden}
td:first-child{border-left:0;padding:0 6px;color:var(--mute);white-space:nowrap}
td:first-child b{color:var(--ink)}
tr.we td:first-child{background:#f1e9d8}
tr.past{opacity:.45}
tr.now td:first-child{background:var(--sea);color:#cfe3e9}
tr.now td:first-child b{color:#fff}
td button{display:block;width:100%;height:38px;border:0;background:transparent;padding:0 5px;text-align:left;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.free button{color:transparent}
td.free button:active{background:#e9f3ee}
td.cont{border-top-color:transparent}
td.cont button{font-weight:400;opacity:.55}
td.block button{background:repeating-linear-gradient(135deg,#dcd8cf 0 6px,#ebe7de 6px 12px)!important;color:#555!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none}
.card strong{display:block}
.card span{display:block;color:var(--mute);font-size:14px}
.card em{font-style:normal;display:block;font-size:14px;margin-top:3px}
.empty{color:var(--mute);font-size:14px;padding:6px 2px}
footer{margin-top:26px;text-align:center}
footer button{background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;padding:10px}
dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:18px 18px 0 0;background:var(--card);max-height:92vh;overflow:auto}
@media(min-width:600px){dialog{margin:auto;border-radius:18px}}
dialog::backdrop{background:rgba(10,30,36,.5)}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:19px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 5px}
input[type=text],input[type=email],input[type=date],input[type=number],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:46px}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.units{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.unit{position:relative}
.unit input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.unit div{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:62px}
.unit b{display:block;font-size:15px}.unit small{color:var(--mute);font-size:12px}
.unit input:checked+div{border-color:var(--ok);background:#e9f5ee}
.unit input:disabled+div{background:#f0ece3;opacity:.7}
.unit input:disabled+div small{color:#b3261e}
.unit input:focus-visible+div{outline:2px solid var(--sea2)}
.err{color:#b3261e;font-size:14px;min-height:20px;margin:10px 0 0}
.sheet .actions{margin:14px 0 0}
.kv{margin:0 0 4px}.kv dt{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;margin-top:10px}.kv dd{margin:2px 0 0}
.gate{max-width:380px;margin:12vh auto 0;padding:0 20px;text-align:center}
.gate h1{color:var(--sea);margin:0 0 4px}.gate p{color:var(--mute);margin:0 0 18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="sheet"></dialog>
<div id="toast" role="status"></div>

<script type="module">
/* ============================================================
   SETUP: paste your Firebase web config between the braces.
   While this is null the app runs in DEMO mode (data stays on
   this device only, owner PIN is 1234).
   ============================================================ */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyADV7B8A1z3GX22M-4X60P-NoCv_9D8fG8",
    authDomain: "just-rest-inn-too.firebaseapp.com",
    projectId: "just-rest-inn-too",
    storageBucket: "just-rest-inn-too.firebasestorage.app",
    messagingSenderId: "572857792777",
    appId: "1:572857792777:web:dce0db68b34bb2d52e3bd8"
  },

  // Optional: confirmation emails with a private change/cancel link (see SETUP.md step 6).
  emailjs: null
  /* emailjs: { serviceId:"...", templateId:"...", publicKey:"..." } */
};

const HOUSE = 'Just Rest Inn Too', PLACE = 'Manyana';
const UNITS = [
  {id:'bed1', name:'Bedroom 1', short:'Bed 1', beds:'Queen'},
  {id:'bed2', name:'Bedroom 2', short:'Bed 2', beds:'Queen'},
  {id:'bed3', name:'Bedroom 3', short:'Bed 3', beds:'Queen'},
  {id:'shed', name:'The Shed',  short:'Shed',  beds:'2 queens + 2 double bunks'}
];
const MAX_NIGHTS = 90;

/* ---------- dates (plain YYYY-MM-DD strings, no timezone maths) ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = toDate(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const fmt = s => toDate(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
function nights(ci,co){ const out=[]; for(let d=ci; d<co && out.length<=MAX_NIGHTS+1; d=addDays(d,1)) out.push(d); return out; }
const nightKeys = b => b.units.flatMap(u => nights(b.checkIn,b.checkOut).map(d => `${u}_${d}`));

/* ---------- storage ---------- */
function localStore(){
  const KEY='jri_demo'; let cb=()=>{};
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||[] }catch{ return [] } };
  const write=l=>{ try{ localStorage.setItem(KEY,JSON.stringify(l)) }catch{} cb(l); };
  let mem=read();
  return {
    demo:true,
    async init(){ return true },
    subscribe(f){ cb=f; f(mem) },
    async save(b,prev){
      const id=prev?prev.id:'b'+Date.now()+Math.random().toString(36).slice(2,6);
      mem=mem.filter(x=>x.id!==id).concat({...b,id}); write(mem); return id;
    },
    async remove(b){ mem=mem.filter(x=>x.id!==b.id); write(mem) },
    async checkOwner(pin){ return pin==='1234' }
  };
}
async function fireStore(cfg){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const {initializeApp}=await import(base+'firebase-app.js');
  const fs=await import(base+'firebase-firestore.js');
  const db=fs.getFirestore(initializeApp(cfg));
  let code; const col=n=>fs.collection(db,'houses',code,n);
  return {
    async init(c){ if(!c||/[\/\s]/.test(c)) return false;
      const s=await fs.getDoc(fs.doc(db,'houses',c)); if(!s.exists()) return false; code=c; return true },
    subscribe(f,onErr){ fs.onSnapshot(col('bookings'), s=>f(s.docs.map(d=>({id:d.id,...d.data()}))), onErr) },
    async save(b,prev){
      const batch=fs.writeBatch(db);
      const ref=prev?fs.doc(col('bookings'),prev.id):fs.doc(col('bookings'));
      const oldK=new Set(prev?nightKeys(prev):[]), newK=new Set(nightKeys(b));
      for(const k of oldK) if(!newK.has(k)) batch.delete(fs.doc(col('nights'),k));
      // The rules refuse to overwrite an existing night, so a clash fails the whole batch.
      for(const k of newK) if(!oldK.has(k)) batch.set(fs.doc(col('nights'),k),{bookingId:ref.id});
      batch.set(ref,b);
      await batch.commit();
      return ref.id;
    },
    async remove(b){
      const batch=fs.writeBatch(db);
      for(const k of nightKeys(b)) batch.delete(fs.doc(col('nights'),k));
      batch.delete(fs.doc(col('bookings'),b.id));
      await batch.commit();
    },
    async checkOwner(pin){ if(!pin||/[\/\s]/.test(pin)) return false;
      return (await fs.getDoc(fs.doc(db,'houses',code,'owner',pin))).exists() }
  };
}

/* ---------- state ---------- */
const ls = { get:k=>{ try{ return localStorage.getItem(k) }catch{ return null } },
             set:(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch{} } };
let store, bookings=[], me=ls.get('jri_name')||'', owner=false;
let view = (()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()} })();
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const same = (a,b) => (a||'').trim().toLowerCase()===(b||'').trim().toLowerCase();
const mine = b => !!me && (same(b.name,me) || same(b.createdBy,me));
/* Each booking has a private key. This phone keeps the keys for bookings made on it;
   the confirmation email carries the key in its link. The database only holds a hash. */
let houseCode='';
const tokens = (()=>{ try{ return JSON.parse(ls.get('jri_tokens'))||{} }catch{ return {} } })();
const keepToken = (id,t) => { tokens[id]=t; ls.set('jri_tokens',JSON.stringify(tokens)) };
const newToken = () => { const a=new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join('') };
async function hashToken(t, algo = globalThis.crypto?.subtle ? 's' : 'f'){
  if(algo==='s'){ const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
    return 's:'+[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let x=2166136261,y=5381; for(const c of t){ x=Math.imul(x^c.charCodeAt(0),16777619)>>>0; y=(Math.imul(y,33)^c.charCodeAt(0))>>>0 }
  return 'f:'+x.toString(16)+y.toString(16);   // fallback for pages not served over https
}
async function tokenFits(b,t){ if(!b?.tokenHash||!t) return false;
  const algo=b.tokenHash[0]; if(algo==='s' && !globalThis.crypto?.subtle) return false;
  return await hashToken(t,algo)===b.tokenHash; }
const hasKey = b => !!tokens[b.id];
const canEdit = b => owner || (!b.isBlock && (hasKey(b) || (!b.tokenHash && mine(b))));
const manageLink = (id,t) => `${location.href.split('#')[0]}#k=${encodeURIComponent(houseCode)}&m=${id}.${t}`;
async function sendEmail(to,b,link){
  const e=CONFIG.emailjs, n=nights(b.checkIn,b.checkOut).length;
  const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({service_id:e.serviceId,template_id:e.templateId,user_id:e.publicKey,template_params:{
      to_email:to, to_name:b.name, house:HOUSE, place:PLACE,
      dates:`${fmt(b.checkIn)} to ${fmt(b.checkOut)} (${n} night${n==1?'':'s'})`,
      rooms:b.units.map(unitName).join(', '), guests:String(b.guests), notes:b.notes||'None', manage_link:link }})});
  if(!r.ok) throw new Error('email '+r.status+' '+await r.text());
}
const HUES=[200,18,150,280,42,330,95,235,0,172];
function hue(name){ let h=0; for(const c of (name||'').trim().toLowerCase()) h=(h*31+c.charCodeAt(0))>>>0; return HUES[h%HUES.length] }
const bg = n => `hsl(${hue(n)} 70% 87%)`, fg = n => `hsl(${hue(n)} 60% 24%)`, solid = n => `hsl(${hue(n)} 55% 48%)`;
const unitName = id => UNITS.find(u=>u.id===id)?.name || id;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),3200) }

function occupancy(){ const m=new Map(); for(const b of bookings) for(const k of nightKeys(b)) m.set(k,b); return m }
function clash(unit,ci,co,exceptId){
  for(const b of bookings){ if(b.id===exceptId || !b.units.includes(unit)) continue;
    if(b.checkIn<co && ci<b.checkOut) return b; }
  return null;
}

/* ---------- main render ---------- */
function render(){
  const occ=occupancy(), t=today();
  const first=new Date(view.y,view.m,1), days=new Date(view.y,view.m+1,0).getDate();
  const title=first.toLocaleDateString('en-AU',{month:'long',year:'numeric'});
  let rows='';
  for(let i=1;i<=days;i++){
    const d=`${view.y}-${pad(view.m+1)}-${pad(i)}`, dt=toDate(d), dow=dt.getDay();
    const cls=[(dow===0||dow===6||dow===5)?'we':'', d<t?'past':'', d===t?'now':''].join(' ');
    let tds=`<td><b>${i}</b> ${dt.toLocaleDateString('en-AU',{weekday:'short'})}</td>`;
    for(const u of UNITS){
      const b=occ.get(`${u.id}_${d}`);
      if(!b){ tds+=`<td class="free"><button data-act="new" data-d="${d}" data-u="${u.id}" aria-label="Book ${u.name} from ${fmt(d)}">+</button></td>`; continue; }
      const cont = b.checkIn!==d && i!==1;
      const label = b.isBlock ? 'Blocked' : b.name;
      tds+=`<td class="${b.isBlock?'block':''} ${cont?'cont':''}"><button data-act="detail" data-id="${esc(b.id)}" style="background:${bg(b.name)};color:${fg(b.name)}" aria-label="${esc(label)}, ${u.name}, ${fmt(d)}">${esc(label)}</button></td>`;
    }
    rows+=`<tr class="${cls}">${tds}</tr>`;
  }
  const up=bookings.filter(b=>b.checkOut>t).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));
  const cards=up.map(b=>{
    const n=nights(b.checkIn,b.checkOut).length;
    const head=b.isBlock?'Blocked out':`${esc(b.name)}${b.guests?` · ${b.guests} ${b.guests==1?'person':'people'}`:''}`;
    return `<button class="card" data-act="detail" data-id="${esc(b.id)}">
      <i class="dot" style="background:${b.isBlock?'#aaa':solid(b.name)}"></i>
      <div><strong>${head}</strong>
      <span>${fmt(b.checkIn)} → ${fmt(b.checkOut)} · ${n} night${n==1?'':'s'}</span>
      <span>${b.units.length===UNITS.length?'Whole property':b.units.map(unitName).map(esc).join(', ')}</span>
      ${b.notes?`<em>“${esc(b.notes)}”</em>`:''}</div></button>`;
  }).join('') || `<div class="empty">Nobody's booked yet. The place is all yours.</div>`;

  $('#app').innerHTML=`
  <header><div class="in"><div><p>${esc(PLACE)}</p><h1>${esc(HOUSE)}</h1></div>
    <button class="who" data-act="name">${me?esc(me):'Who are you?'}${owner?' · owner':''}</button></div></header>
  <div class="wrap">
    ${store.demo?`<div class="demo"><b>Demo mode.</b> Bookings are saved on this device only until the database is connected.</div>`:''}
    <div class="actions"><button class="btn" data-act="new">Book a stay</button>
      ${owner?`<button class="btn alt" data-act="block">Block out dates</button>`:''}</div>
    <div class="month"><button data-act="prev" aria-label="Previous month">‹</button>
      <strong>${title}</strong>
      <span><button class="today" data-act="today">Today</button> <button data-act="next" aria-label="Next month">›</button></span></div>
    <table><thead><tr><th>Night of</th>${UNITS.map(u=>`<th>${u.short}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="empty">Each row is a night. Tap a blank square to book from that date, or a name for details. Check-out day is free for the next person.</div>
    <h2>Who's going down</h2>${cards}
    <footer><button data-act="owner">${owner?'Leave owner mode':'Owner'}</button></footer>
  </div>`;
}

/* ---------- sheets ---------- */
const sheet=$('#sheet');
function open(html){ sheet.innerHTML=`<div class="sheet">${html}</div>`; if(!sheet.open) sheet.showModal(); }
function close(){ if(sheet.open) sheet.close() }
sheet.addEventListener('click',e=>{ if(e.target===sheet) close() });

function openName(){
  const names=[...new Set(bookings.filter(b=>!b.isBlock).map(b=>b.name))].sort();
  open(`<h3>Who are you?</h3>
    <form data-form="name"><label for="nm">Your name, the way the family knows you</label>
    <input id="nm" name="name" type="text" list="names" value="${esc(me)}" autocomplete="given-name" maxlength="30" required>
    <datalist id="names">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <div class="actions"><button class="btn">Save</button></div></form>`);
}
function openOwner(){
  if(owner){ owner=false; ls.set('jri_pin',null); render(); return; }
  open(`<h3>Owner mode</h3><form data-form="owner"><label for="pin">Owner PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" required>
    <p class="err" id="err"></p><div class="actions"><button class="btn">Unlock</button></div></form>`);
}
function openDetail(id){
  const b=bookings.find(x=>x.id===id); if(!b) return;
  const n=nights(b.checkIn,b.checkOut).length;
  open(`<h3>${b.isBlock?'Blocked out':esc(b.name)}</h3><dl class="kv">
    <dt>Dates</dt><dd>${fmt(b.checkIn)} → ${fmt(b.checkOut)} (${n} night${n==1?'':'s'})</dd>
    <dt>Where</dt><dd>${b.units.map(u=>`${esc(unitName(u))}`).join(', ')}</dd>
    ${b.guests?`<dt>People</dt><dd>${b.guests}</dd>`:''}
    ${b.notes?`<dt>Notes</dt><dd>${esc(b.notes)}</dd>`:''}</dl>
    <div class="actions">${canEdit(b)?`<button class="btn alt" data-act="edit" data-id="${esc(b.id)}">Change</button>
      <button class="btn danger" data-act="cancel" data-id="${esc(b.id)}">Cancel booking</button>`
      :`<button class="btn alt" data-act="close">Close</button>`}</div>
    ${canEdit(b)?'':`<p class="empty">${b.isBlock?'Only the owner can change this.':'To change this booking, open the link in its confirmation email, use the phone it was booked on, or ask the owner.'}</p>`}`);
}
let editing=null, blocking=false;
function openBooking({date,unit,booking,block}={}){
  if(!me && !block && !booking){ openName(); return; }
  editing=booking||null; blocking=!!(block||booking?.isBlock);
  const ci=booking?.checkIn || date || today(), co=booking?.checkOut || addDays(ci,2);
  const picked=new Set(booking?.units || (blocking?UNITS.map(u=>u.id):unit?[unit]:[]));
  open(`<h3>${booking?'Change booking':blocking?'Block out dates':'Book a stay'}</h3>
  <form data-form="booking">
    ${blocking?'':`<label for="bn">Booked for</label><input id="bn" name="name" type="text" maxlength="30" required value="${esc(booking?.name||me)}">`}
    <div class="row"><div><label for="ci">Arrive</label><input id="ci" name="checkIn" type="date" required value="${ci}"></div>
      <div><label for="co">Leave</label><input id="co" name="checkOut" type="date" required value="${co}"></div></div>
    <label>${blocking?'What to block':'Where are you sleeping?'}</label>
    <div class="units">${UNITS.map(u=>`<label class="unit" style="margin:0"><input type="checkbox" name="units" value="${u.id}" ${picked.has(u.id)?'checked':''}>
      <div><b>${u.name}</b><small data-beds="${esc(u.beds)}">${esc(u.beds)}</small></div></label>`).join('')}</div>
    ${blocking?'':`<label for="gs">How many people?</label><input id="gs" name="guests" type="number" inputmode="numeric" min="1" max="30" required value="${booking?.guests||2}">`}
    <label for="nt">${blocking?'Reason (optional)':'Notes (optional)'}</label>
    <textarea id="nt" name="notes" maxlength="200" placeholder="${blocking?'e.g. painting the deck':'e.g. bringing the dog, arriving late Friday'}">${esc(booking?.notes||'')}</textarea>
    ${blocking||(booking&&!hasKey(booking))?'':`<label for="em">Email for your confirmation (optional)</label>
    <input id="em" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" maxlength="120" value="${esc(ls.get('jri_email')||'')}" placeholder="you@example.com">
    <p class="empty" style="padding:6px 0 0">We'll email a private link to change or cancel. Without it, only this phone (or the owner) can change the booking.</p>`}
    <p class="err" id="err"></p>
    <div class="actions"><button type="button" class="btn alt" data-act="close">Back</button><button class="btn" id="go">${booking?'Save changes':blocking?'Block out':'Confirm booking'}</button></div>
  </form>`);
  refreshUnits();
}
function refreshUnits(){
  const f=sheet.querySelector('[data-form=booking]'); if(!f) return;
  const ci=f.checkIn.value, co=f.checkOut.value, ok=ci&&co&&co>ci;
  f.querySelectorAll('input[name=units]').forEach(box=>{
    const small=box.nextElementSibling.querySelector('small');
    const c=ok?clash(box.value,ci,co,editing?.id):null;
    box.disabled=!!c; if(c) box.checked=false;
    small.textContent=c?`Taken: ${c.isBlock?'blocked out':c.name}`:small.dataset.beds;
  });
}
sheet.addEventListener('change',e=>{
  if(e.target.name==='checkIn'){ const f=e.target.form; if(f.checkOut.value<=f.checkIn.value) f.checkOut.value=addDays(f.checkIn.value,1); }
  if(e.target.name==='checkIn'||e.target.name==='checkOut') refreshUnits();
});

async function submitBooking(f){
  const err=sheet.querySelector('#err'), d=new FormData(f);
  const ci=d.get('checkIn'), co=d.get('checkOut'), units=d.getAll('units');
  const fail=m=>{ err.textContent=m; return };
  if(!ci||!co||co<=ci) return fail('Leave date needs to be after the arrive date.');
  if(nights(ci,co).length>MAX_NIGHTS) return fail(`That's longer than ${MAX_NIGHTS} nights. Split it into two bookings.`);
  if(!units.length) return fail('Pick at least one room, or the shed.');
  for(const u of units){ const c=clash(u,ci,co,editing?.id); if(c) return fail(`${unitName(u)} is already taken by ${c.isBlock?'a block-out':c.name} on those dates.`); }
  const b={ name: blocking ? (editing?.name||me||'Owner') : d.get('name').trim(), units, checkIn:ci, checkOut:co,
    guests: blocking?0:Math.max(1,parseInt(d.get('guests'),10)||1), notes:(d.get('notes')||'').trim(),
    isBlock:blocking, createdBy: editing?.createdBy || me || 'Owner', updatedAt:Date.now() };
  if(!b.name) return fail('Add a name.');
  const go=sheet.querySelector('#go'); go.disabled=true;
  const email=(d.get('email')||'').trim(); let token=null;
  if(!blocking){ token = editing ? tokens[editing.id] : newToken();
    if(editing?.tokenHash) b.tokenHash=editing.tokenHash;
    else { token = token || newToken(); b.tokenHash=await hashToken(token); } }
  try{ const id=await store.save(b,editing);
    if(token) keepToken(id,token);
    let msg=editing?'Booking updated':blocking?'Dates blocked':'Booked. See you down there!';
    if(email && token){ ls.set('jri_email',email);
      if(!CONFIG.emailjs) msg+=' (No email sent: email is not set up yet.)';
      else try{ await sendEmail(email,b,manageLink(id,token)); msg+=' Confirmation emailed.' }
           catch(e2){ console.error(e2); msg='Saved, but the email did not send. This phone can still change it.' } }
    close(); toast(msg);
    view={y:toDate(ci).getFullYear(), m:toDate(ci).getMonth()}; render(); }
  catch(e){ console.error(e); go.disabled=false;
    fail(/permission|denied/i.test(e?.code||e?.message||'') ? 'Someone just grabbed one of those rooms. Close this and check the calendar.' : 'Could not save. Check your connection and try again.'); }
}

/* ---------- events ---------- */
document.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target, kind=f.dataset.form;
  if(kind==='name'){ me=f.name.value.trim(); ls.set('jri_name',me); close(); render(); }
  if(kind==='booking') submitBooking(f);
  if(kind==='gate'){ const c=f.code.value.trim(); f.querySelector('button').disabled=true; if(!await enter(c)){ f.querySelector('button').disabled=false; $('#gerr').textContent="That passcode didn't work."; } }
  if(kind==='owner'){ const pin=f.pin.value.trim(); let ok=false; try{ ok=await store.checkOwner(pin) }catch{}
    if(ok){ owner=true; ls.set('jri_pin',pin); close(); render(); toast('Owner mode on'); } else sheet.querySelector('#err').textContent='Wrong PIN.'; }
});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, id=el.dataset.id;
  if(a==='prev'||a==='next'){ const d=new Date(view.y,view.m+(a==='next'?1:-1),1); view={y:d.getFullYear(),m:d.getMonth()}; render(); }
  if(a==='today'){ const d=new Date(); view={y:d.getFullYear(),m:d.getMonth()}; render(); }
  if(a==='new') openBooking({date:el.dataset.d&&el.dataset.d>=today()?el.dataset.d:undefined, unit:el.dataset.u});
  if(a==='block') openBooking({block:true});
  if(a==='detail') openDetail(id);
  if(a==='edit') openBooking({booking:bookings.find(b=>b.id===id)});
  if(a==='name') openName();
  if(a==='owner') openOwner();
  if(a==='close') close();
  if(a==='cancel'){ const b=bookings.find(x=>x.id===id); if(!b) return;
    if(el.dataset.sure){ el.disabled=true; try{ await store.remove(b); close(); toast('Booking cancelled'); }catch(err){ console.error(err); el.disabled=false; toast('Could not cancel. Try again.'); } }
    else { el.dataset.sure='1'; el.textContent='Tap again to confirm'; } }
});

/* ---------- boot ---------- */
function gate(msg){
  $('#app').innerHTML=`<div class="gate"><h1>${esc(HOUSE)}</h1><p>${esc(PLACE)}</p>
    <form data-form="gate"><input name="code" type="text" placeholder="Family passcode" autocapitalize="none" autocomplete="off" required>
    <p class="err" id="gerr">${esc(msg||'')}</p><div class="actions"><button class="btn">Come in</button></div></form></div>`;
}
async function enter(code){
  let ok=false; try{ ok=await store.init(code) }catch(e){ console.error(e) }
  if(!ok) return false;
  ls.set('jri_code',code); houseCode=code;
  const pin=ls.get('jri_pin'); if(pin){ try{ owner=await store.checkOwner(pin) }catch{} }
  let pending=new URLSearchParams(location.hash.slice(1)).get('m');
  store.subscribe(async list=>{ bookings=list; render(); if(sheet.open) refreshUnits();
      if(pending){ const [id,t]=pending.split('.'); pending=null; const b=bookings.find(x=>x.id===id);
        history.replaceState(null,'',location.pathname+location.search+'#k='+encodeURIComponent(code));
        if(!b) toast('That booking no longer exists.');
        else if(await tokenFits(b,t)){ keepToken(id,t); render(); const d0=toDate(b.checkIn); view={y:d0.getFullYear(),m:d0.getMonth()}; render(); openDetail(id); }
        else toast('That link is not valid for this booking.'); } },
                  err=>{ console.error(err); toast('Lost connection to the bookings.'); });
  if(!me && !pending) openName();
  return true;
}
(async()=>{
  try{ store = CONFIG.firebase ? await fireStore(CONFIG.firebase) : localStore(); }
  catch(e){ console.error(e); $('#app').innerHTML='<div class="gate"><p>Could not reach the booking database. Check your connection and reload.</p></div>'; return; }
  if(store.demo){ await enter('demo'); return; }
  const fromLink=new URLSearchParams(location.hash.slice(1)).get('k');
  const code=fromLink||ls.get('jri_code');
  if(!code || !await enter(code)) gate(code?"That link's passcode didn't work.":'');
})();
</script>
